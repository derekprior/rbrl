# Time slots define when games can be played on each type of day.
# Times use 24-hour format (e.g., "17:45" = 5:45 PM).
time_slots:
  weekday: ["17:45"]
  saturday: ["12:30", "14:45", "17:00"]
  sunday: ["17:00"]

  # Makeup-only slots: not used by the initial scheduler, but considered
  # as candidates by `rbrl schedule reschedule`.
  makeup_sunday: ["14:45"]

  # Holiday dates are treated as Sundays for scheduling purposes.
  # Use this for holidays that fall on weekdays but have Sunday-style availability.
  holiday_dates:
    - "2026-05-25"

# Strategy determines how matchups are generated.
# "division_weighted" plays each intra-division opponent twice and each
# inter-division opponent once, with balanced home/away assignments.
strategy: division_weighted

# Constraints checked when generating or rescheduling.
#
# Each entry has:
#   value: numeric threshold or boolean enable flag (varies per constraint).
#   mode:  severity. Either a single value applied to all modes, or a per-mode
#          map. Modes not listed default to "rule".
#     - rule       hard requirement; violation fails the schedule
#     - guideline  soft preference; violation produces a warning
#     - disabled   not checked
#
# Modes: preseason (initial generation) | reschedule (in-season makeups).
constraints:
  max_games_per_day_per_team:
    value: 1
    mode: rule
  max_games_per_timeslot:
    value: 2
    mode: rule
  max_consecutive_days:
    value: 2
    mode: rule
  max_games_per_week:
    value: 3
    mode: rule
  max_3_in_4_days:
    value: true
    mode:
      preseason: rule
      reschedule: guideline
  min_days_between_same_matchup:
    value: 7
    mode:
      preseason: guideline
      reschedule: disabled
  balance_sunday_games:
    value: true
    mode:
      preseason: guideline
      reschedule: disabled
  balance_pace:
    value: true
    mode:
      preseason: guideline
      reschedule: disabled

# GameChanger team name mappings. Maps config team names to their names in
# GameChanger. Defaults to the config team name if omitted.
gamechanger:
  team_names:
    Angels: Angels
    Astros: Astros
    Athletics: "A's"
    Mariners: "Mariners - RBRL"
    Royals: Royals
    Cubs: Cubs
    Padres: RBRL Padres
    Phillies: RBRL Phillies
    Pirates: Pirates
    Marlins: Marlins
